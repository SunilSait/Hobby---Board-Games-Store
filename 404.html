<!DOCTYPE html>
<html lang="en" id="root-html">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Page not found. The page you're looking for doesn't exist or has been moved.">
    <title>404 — Page Not Found | Dice & Beyond</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="style.css">
    <style>
        .error-illustration {
            position: relative;
            display: inline-block;
            margin-bottom: 2rem;
        }
        .error-illustration .dice-spin {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 120px;
            height: 120px;
            opacity: 0.12;
            animation: spin 12s linear infinite;
        }
        .error-subtitle {
            font-family: var(--font-heading);
            font-weight: 700;
            font-size: clamp(1.5rem, 3vw, 2rem);
            color: var(--text-heading);
            margin-bottom: 0.75rem;
        }
        .error-desc {
            color: var(--text-body);
            font-size: 1.05rem;
            max-width: 420px;
            margin: 0 auto 2.5rem;
        }
    </style>
</head>
<body class="fullscreen-page">

<!-- Top Bar -->
<div style="display:flex;align-items:center;justify-content:space-between;padding:1.25rem 1.5rem;max-width:1200px;margin:0 auto;width:100%;">
    <a href="index.html" class="nav-logo" aria-label="Dice & Beyond Home">
        <img src="logo.svg" alt="Dice & Beyond Logo" width="38" height="38" style="width:38px;height:38px;object-fit:contain;display:block;" />
        <div class="nav-logo-text">
            <span class="brand-top">DICE</span>
            <span class="brand-bottom">& Beyond</span>
        </div>
    </a>
    <div style="display:flex;gap:0.5rem;">
        <button onclick="toggleDir()" class="auth-toggle-btn" title="Toggle Direction">
            <span class="dir-label" style="font-size:0.625rem;font-weight:600;">LTR</span>
        </button>
        <button onclick="toggleTheme()" class="auth-toggle-btn" title="Toggle Theme" aria-label="Toggle dark mode">
            <span class="theme-icon-wrap"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg></span>
        </button>
    </div>
</div>

<!-- Content -->
<div class="fullscreen-content">
    <div style="position:relative;max-width:540px;width:100%;margin:0 auto;">
        <div class="error-illustration">
            <!-- Spinning dice behind -->
            <svg class="dice-spin" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M60 75 L95 55 L95 85 L60 105 Z" fill="#7C3AED" opacity="0.5"/>
                <path d="M25 55 L60 35 L60 75 L25 95 Z" fill="#7C3AED" opacity="0.7"/>
                <path d="M25 55 L60 35 L95 55 L60 75 Z" fill="#A78BFA" opacity="0.6"/>
                <circle cx="42" cy="50" r="3.5" fill="#fff" opacity="0.5"/>
                <circle cx="60" cy="52" r="3.5" fill="#fff" opacity="0.5"/>
                <circle cx="78" cy="50" r="3.5" fill="#fff" opacity="0.5"/>
            </svg>
            <div class="error-code">404</div>
        </div>
        <div class="error-subtitle">Page Not Found</div>
        <p class="error-desc">Looks like this game piece went missing! The page you're looking for has been moved, deleted, or never existed.</p>
        <div style="display:flex;gap:0.75rem;justify-content:center;flex-wrap:wrap;">
            <a href="index.html" class="btn btn-primary btn-lg"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg> Back to Home</a>
            <a href="contact.html" class="btn btn-secondary btn-lg">Contact Support</a>
        </div>
    </div>
</div>

<script src="components.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', function() {
        initAuthPage();
    });
</script>
</body>
</html>
